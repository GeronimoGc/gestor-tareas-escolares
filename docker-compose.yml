services:
  # 1. Base de datos MongoDB Local (funciona de inmediato sin configurar nada)
  # Si deseas conectar a MongoDB Atlas en la nube, solo edita MONGODB_URI en backend/.env
  mongodb:
    image: mongo:7.0
    container_name: gestor_tareas_db
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - sena-network

  # 2. Visor Gráfico Web de MongoDB (para evidencias y capturas de pantalla)
  # Abre http://localhost:8085 en tu navegador para ver colecciones y documentos
  mongo-express:
    image: mongo-express:latest
    container_name: gestor_tareas_mongo_express
    restart: unless-stopped
    ports:
      - "8085:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      - mongodb
    networks:
      - sena-network

  # 3. Backend API REST (Node.js + Express + Mongoose)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gestor_tareas_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      # Usa la variable de entorno MONGODB_URI si existe; si no, usa el contenedor mongodb local
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017/gestor_tareas_sena}
    depends_on:
      - mongodb
    networks:
      - sena-network

volumes:
  mongo_data:
    driver: local

networks:
  sena-network:
    driver: bridge
